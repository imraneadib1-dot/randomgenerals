<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The mark on its own tile. Unlike the rest of the app this cannot
       use currentColor - a favicon renders outside the page, with no
       inherited colour and no way to read the browser's theme - so the
       two colours are fixed: the cream ground and the bronze the logo
       is drawn in.

       A tile rather than a bare mark, because a thin outline on its own
       vanishes against dark browser chrome. The rounded square is what
       guarantees contrast whatever the tab strip is doing.

       Same geometry as static/logo.svg, scaled by 25/88 = 0.284 and
       inset so the stroke never touches the tile edge. The radii are
       scaled together and each centre re-derived from the tangency rule
       (distance between centres = difference of radii) rather than
       scaled independently - rounding each number on its own is what
       breaks the touch points and turns the coil into three loose
       circles:

         outer   r 25.0  cy 33.0
         middle  r 16.2  cy 33.0 - (25.0 - 16.2) = 24.2
         inner   r  9.4  cy 24.2 + (16.2 -  9.4) = 31.0 -->
  <rect width="64" height="64" rx="14" fill="#f2ece4"/>
  <g fill="none" stroke="#6e6420" stroke-width="3.4" stroke-linecap="round">
    <circle cx="32" cy="33" r="25"/>
    <circle cx="32" cy="24.2" r="16.2"/>
    <circle cx="32" cy="31" r="9.4"/>
  </g>
</svg>
