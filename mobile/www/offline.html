<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RandomGenerals AI</title>
    <style>
      /* This screen ships inside the app binary, so it has to stand on
         its own with no network at all - no web fonts, no CDN, no
         stylesheet from the server. It is the only thing a person sees
         when the connection is gone, and a broken offline screen is
         worse than none. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        /* Safe areas, or this sits under the notch on an iPhone. */
        padding: max(24px, env(safe-area-inset-top)) 26px
                 max(24px, env(safe-area-inset-bottom));
        background: #141a22;
        color: #e9e8e1;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
              system-ui, sans-serif;
        text-align: center;
      }
      .mark { width: 76px; height: 76px; margin: 0 auto 22px; color: #c9b96a; }
      h1 { font-size: 21px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 22px; color: #b3b5ac; max-width: 34ch; }
      button {
        font: inherit;
        font-weight: 600;
        color: #141a22;
        background: #c9b96a;
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { opacity: 0.8; }
      .status { margin-top: 18px; font-size: 13px; color: #878a82; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 200 200" fill="none"
           stroke="currentColor" stroke-width="7" stroke-linecap="round"
           aria-hidden="true">
        <circle cx="100" cy="100" r="88" />
        <circle cx="100" cy="69" r="57" />
        <circle cx="100" cy="93" r="33" />
      </svg>
      <h1>No connection</h1>
      <p>
        RandomGenerals needs the internet to answer. Reconnect and this
        will pick up where you left off.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status"></p>
    </main>

    <script>
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");

      async function attempt() {
        status.textContent = "Checking…";
        retry.disabled = true;
        try {
          // A HEAD to the health endpoint rather than loading the whole
          // app: it answers in a few bytes and says plainly whether the
          // server is reachable.
          const res = await fetch("https://randomgenerals.com/api/health", {
            method: "HEAD",
            cache: "no-store",
          });
          if (res.ok) {
            window.location.replace("https://randomgenerals.com/app");
            return;
          }
          status.textContent = "The server answered " + res.status + ".";
        } catch (_) {
          status.textContent = "Still offline.";
        } finally {
          retry.disabled = false;
        }
      }

      retry.addEventListener("click", attempt);
      // Retry by itself the moment the device says it is back, so nobody
      // has to sit here tapping.
      window.addEventListener("online", attempt);
    </script>
  </body>
</html>
